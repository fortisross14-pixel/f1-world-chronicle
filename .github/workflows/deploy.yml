name: Deploy F1 World Chronicle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # A node_modules directory copied or committed from Windows can contain
      # non-executable .bin shims. Always recreate dependencies on the Linux runner.
      - name: Remove stale dependencies
        run: rm -rf node_modules

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Run simulation smoke test
        run: npm run smoke

      - name: Run deterministic universe test
        run: npm run deterministic

      - name: Run universe v4 systems test
        run: npm run universe-v4

      - name: Run universe v5 systems test
        run: npm run universe-v5

      - name: Run universe v6 market test
        run: npm run universe-v6

      # package.json invokes Vite through Node directly, so the build does not
      # depend on the executable bit of node_modules/.bin/vite.
      - name: Build GitHub Pages bundle
        run: npm run build

      - name: Add Pages fallbacks
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
